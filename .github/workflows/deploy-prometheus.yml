name: Deploy Prometheus with Helm

on:
  push:
    branches:
      - main  # Trigger when changes are pushed to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.168.0.145 >> ~/.ssh/known_hosts

      - name: Install Prometheus using Helm
        run: |
          ssh -i ~/.ssh/id_rsa root@192.168.0.145 << 'EOF'
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo update
            helm upgrade --install prometheus prometheus-community/prometheus --namespace monitoring --create-namespace
          EOF
